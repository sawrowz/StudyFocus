                : `<button onclick="startPomodoro()" class="px-8 py-3.5 rounded-2xl bg-accent hover:bg-accentHover text-white font-bold text-sm sm:text-base shadow-md transition flex items-center gap-2">

    function applyCustomPomoDuration() {
      const val = parseInt(document.getElementById('custom-pomo-min').value, 10);
      if (!val || val < 1 || val > 240) {
        showToast('Enter a duration between 1 and 240 minutes.', 'warning');
        return;
      }
      setPomodoroMode('focus', val);
      showToast(`Custom focus timer set to ${val} minutes.`, 'info');
    }

    // === VIEW 3: STOPWATCH ===
    function renderStopwatchView(container) {
      const elapsed = getStopwatchElapsedMs();
      const fmt = formatStopwatchHMS(elapsed);

      container.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-bold text-textPrimary">Open-Ended Study Stopwatch</h1>

            </div>
            <button onclick="openFocusOverlay()" class="px-4 py-2 rounded-xl bg-bgSurface border border-borderSubtle hover:border-accent text-xs font-semibold text-textPrimary flex items-center gap-2 self-start">

            </div>

                <span id="sw-clock-main" class="text-5xl sm:text-7xl font-bold tracking-tight text-textPrimary">${fmt.main}</span>
                <span id="sw-clock-ms" class="text-2xl sm:text-3xl font-semibold text-accent ml-1">${fmt.ms}</span>
              </div>
              <p class="text-xs text-textMuted mt-3">
                ${timerRuntime.swRunning ? '● Recording active elapsed study duration' : (elapsed > 0 ? '⏸ Paused (paused time will not be logged)' : 'Press Start when you begin studying')}

            <div class="flex flex-wrap items-center justify-center gap-3">

                     <i data-lucide="pause" class="w-5 h-5"></i> Pause
                   </button>`
                : `<button onclick="startStopwatch()" class="px-8 py-3.5 rounded-2xl bg-accent hover:bg-accentHover text-white font-bold text-sm sm:text-base shadow-md transition flex items-center gap-2">
                     <i data-lucide="play" class="w-5 h-5"></i> ${elapsed > 0 ? 'Resume' : 'Start Stopwatch'}
                   </button>`
              }

              ${elapsed > 0
                ? `<button onclick="finishAndSaveStopwatch()" class="px-6 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm sm:text-base shadow-md transition flex items-center gap-2">
                     <i data-lucide="check-circle-2" class="w-5 h-5"></i> Finish & Save Session
                   </button>
                   <button onclick="resetStopwatch()" class="px-5 py-3.5 rounded-2xl bg-bgElevated border border-borderSubtle hover:border-rose-500 text-textSecondary hover:text-rose-400 font-semibold text-sm transition flex items-center gap-2">
                     <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Discard
                   </button>`

              }
            </div>
          </div>

      `;

    // === VIEW 4: STUDY PLANNER & TASKS ===
    function renderPlannerView(container) {
      const todayStr = getLocalDateStr();
      let filteredTasks = [];
      if (plannerFilter === 'today') {
        filteredTasks = appState.tasks.filter((t) => !t.completed && (!t.deadline || t.deadline <= todayStr));
      } else if (plannerFilter === 'upcoming') {
        filteredTasks = appState.tasks.filter((t) => !t.completed && t.deadline && t.deadline > todayStr);
      } else {
        filteredTasks = appState.tasks.filter((t) => t.completed);
      }

      container.innerHTML = `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Tasks & Daily Study Planner</h1>
            <p class="text-xs sm:text-sm text-textSecondary">Organize assignments, exam topics, priorities, and daily time blocks.</p>
          </div>

          <!-- Add Task Form -->
          <form onsubmit="handleAddTask(event)" class="card p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3 items-end">
            <div class="lg:col-span-4">
              <label class="block text-xs font-semibold text-textSecondary mb-1">Task Description</label>
              <input id="task-title-input" type="text" required placeholder="e.g., Complete Graph Algorithms chapter" class="w-full px-3.5 py-2.5 rounded-xl bg-bgElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-accent" />
            </div>
            <div class="lg:col-span-3">
              <label class="block text-xs font-semibold text-textSecondary mb-1">Subject</label>
              <select id="task-subject-input" class="w-full px-3.5 py-2.5 rounded-xl bg-bgElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-accent">
                ${appState.subjects.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
              </select>
            </div>
            <div class="lg:col-span-2">
              <label class="block text-xs font-semibold text-textSecondary mb-1">Deadline</label>
              <input id="task-deadline-input" type="date" value="${todayStr}" class="w-full px-3 py-2.5 rounded-xl bg-bgElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-accent" />
            </div>
            <div class="lg:col-span-1">
              <label class="block text-xs font-semibold text-textSecondary mb-1">Priority</label>
              <select id="task-priority-input" class="w-full px-2.5 py-2.5 rounded-xl bg-bgElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-accent">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="lg:col-span-2 flex gap-2">
              <input id="task-slot-input" type="text" placeholder="09:00 AM" class="w-full px-3 py-2.5 rounded-xl bg-bgElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-accent" title="Scheduled Time Slot" />
              <button type="submit" class="px-4 py-2.5 rounded-xl bg-accent hover:bg-accentHover text-white font-semibold text-sm shrink-0 transition">Add</button>
            </div>
          </form>

          <!-- Filter Tabs -->
          <div class="flex items-center gap-2">
            <button onclick="plannerFilter='today'; renderView('planner')" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${plannerFilter === 'today' ? 'bg-accent text-white' : 'bg-bgSurface border border-borderSubtle text-textSecondary hover:text-textPrimary'}">
              Today (${appState.tasks.filter((t) => !t.completed && (!t.deadline || t.deadline <= todayStr)).length})
            </button>
            <button onclick="plannerFilter='upcoming'; renderView('planner')" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${plannerFilter === 'upcoming' ? 'bg-accent text-white' : 'bg-bgSurface border border-borderSubtle text-textSecondary hover:text-textPrimary'}">
              Upcoming (${appState.tasks.filter((t) => !t.completed && t.deadline && t.deadline > todayStr).length})
            </button>
            <button onclick="plannerFilter='completed'; renderView('planner')" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${plannerFilter === 'completed' ? 'bg-accent text-white' : 'bg-bgSurface border border-borderSubtle text-textSecondary hover:text-textPrimary'}">
              Completed (${appState.tasks.filter((t) => t.completed).length})
            </button>
          </div>

          <!-- Task List -->
          <div class="space-y-3">
            ${filteredTasks.length === 0
              ? `<div class="card p-10 text-center">
                   <p class="text-sm font-semibold text-textSecondary">No tasks in this section</p>
                   <p class="text-xs text-textMuted mt-1">Use the form above to add a study task or schedule a session.</p>
                 </div>`
              : filteredTasks.map((t) => {
                  const subj = getSubjectById(t.subjectId);
                  return `
                    <div class="card p-4 flex items-center justify-between gap-4">
                      <div class="flex items-center gap-3.5 min-w-0">
                        <button onclick="toggleTaskComplete('${t.id}')" class="w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition ${t.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-textMuted hover:border-accent'}">
                          ${t.completed ? `<i data-lucide="check" class="w-3.5 h-3.5"></i>` : ''}
                        </button>
                        <div class="min-w-0">
                          <p class="text-sm font-semibold ${t.completed ? 'line-through text-textMuted' : 'text-textPrimary'} truncate">${escapeHtml(t.title)}</p>
                          <div class="flex flex-wrap items-center gap-2.5 text-xs text-textMuted mt-1">
                            <span class="font-medium" style="color:${subj.color}">● ${escapeHtml(subj.name)}</span>
                            ${t.deadline ? `<span>📅 ${t.deadline}</span>` : ''}
                            ${t.timeSlot ? `<span>⏰ ${escapeHtml(t.timeSlot)}</span>` : ''}
                          </div>
                        </div>
                      </div>
                      <div class="flex items-center gap-2 shrink-0">
                        <span class="text-[10px] font-bold uppercase px-2.5 py-1 rounded-lg ${priorityBadgeClass(t.priority)}">${t.priority}</span>
                        <button onclick="deleteTask('${t.id}')" class="p-2 rounded-lg text-textMuted hover:text-rose-400 hover:bg-bgElevated transition" title="Delete Task">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')
            }
          </div>
        </div>
      `;
    }

    function priorityBadgeClass(priority) {
      if (priority === 'High') return 'bg-rose-500/15 text-rose-400';
      if (priority === 'Low') return 'bg-sky-500/15 text-sky-400';
      return 'bg-amber-500/15 text-amber-400';
    }

    function handleAddTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title-input').value.trim();
      const subjectId = document.getElementById('task-subject-input').value;
      const deadline = document.getElementById('task-deadline-input').value;
      const priority = document.getElementById('task-priority-input').value;
      const timeSlot = document.getElementById('task-slot-input').value.trim();
      if (!title) return;

      appState.tasks.unshift({
        id: 'task_' + Date.now(),
        title,
        subjectId,
        deadline,
        priority,
        timeSlot,
        completed: false,
        createdAt: new Date().toISOString()
      });
      saveState();
      showToast('Study task added to planner.', 'success');
      renderView('planner');
    }

    function toggleTaskComplete(id) {
      const task = appState.tasks.find((t) => t.id === id);
      if (!task) return;
      task.completed = !task.completed;
      if (task.completed) {
        appState.bonusXp = (appState.bonusXp || 0) + 25;
        showToast('Task completed! +25 XP', 'success');
      }
      saveState();
      renderView(currentView);
    }

    function deleteTask(id) {
      appState.tasks = appState.tasks.filter((t) => t.id !== id);
      saveState();
      renderView('planner');
    }

    // === VIEW 5: SUBJECTS & STUDY GOALS ===
    function renderSubjectsView(container) {
      const stats = computeStudyStats();
      const todayStr = stats.todayStr;

      // Today's seconds per subject
      const todayBySubj = {};
      appState.sessions.forEach((s) => {
        if (s.date === todayStr) {
          todayBySubj[s.subjectId] = (todayBySubj[s.subjectId] || 0) + s.durationSeconds;
        }
      });

      const goalCards = [
        { label: 'Daily Goal', currentSec: stats.todaySeconds, targetSec: appState.goals.dailyMinutes * 60 },
        { label: 'Weekly Goal', currentSec: stats.weeklySeconds, targetSec: appState.goals.weeklyMinutes * 60 },
        { label: 'Monthly Goal', currentSec: stats.monthlySeconds, targetSec: appState.goals.monthlyMinutes * 60 },
        { label: 'Long-Term Goal', currentSec: stats.lifetimeSeconds, targetSec: appState.goals.longTermHours * 3600 }
      ];

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-bold text-textPrimary">Subjects & Study Goals</h1>
              <p class="text-xs sm:text-sm text-textSecondary">Track subject-wise mastery and daily, weekly, monthly, and long-term targets.</p>
            </div>
            <button onclick="openAddSubjectModal()" class="px-4 py-2.5 rounded-xl bg-accent hover:bg-accentHover text-white text-sm font-semibold shadow-sm transition flex items-center gap-2 self-start">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Subject
            </button>
          </div>

          <!-- Global Goal Progress Bars -->
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            ${goalCards.map((g) => {
              const pct = Math.min(100, Math.round((g.currentSec / Math.max(1, g.targetSec)) * 100));
              return `
                <div class="card p-5">
                  <div class="flex items-center justify-between text-xs font-semibold mb-2">
                    <span class="text-textSecondary">${g.label}</span>
                    <span class="text-accent font-mono">${pct}%</span>
                  </div>
                  <p class="text-lg font-bold font-mono text-textPrimary mb-2">
                    ${formatDurationHuman(g.currentSec)} <span class="text-xs font-normal text-textMuted">/ ${formatDurationHuman(g.targetSec)}</span>
                  </p>
                  <div class="w-full h-2 bg-bgElevated rounded-full overflow-hidden">
                    <div class="h-full bg-accent rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Subject Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${appState.subjects.map((sub) => {
              const totalSec = stats.bySubject[sub.id] || 0;
              const todaySec = todayBySubj[sub.id] || 0;
              const targetSec = (sub.dailyTargetMinutes || 60) * 60;
              const pct = Math.min(100, Math.round((todaySec / Math.max(1, targetSec)) * 100));

              return `
                <div class="card p-5 flex flex-col justify-between">
                  <div>
                    <div class="flex items-start justify-between gap-2 mb-3">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-4 h-4 rounded-lg shrink-0" style="background-color: ${sub.color}"></span>
                        <h3 class="font-bold text-base text-textPrimary truncate">${escapeHtml(sub.name)}</h3>
                      </div>
                      <div class="flex items-center gap-1 shrink-0">
                        <button onclick="openEditSubjectModal('${sub.id}')" class="p-1.5 rounded-lg text-textMuted hover:text-textPrimary hover:bg-bgElevated" title="Edit Subject">
                          <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        ${appState.subjects.length > 1
                          ? `<button onclick="deleteSubject('${sub.id}')" class="p-1.5 rounded-lg text-textMuted hover:text-rose-400 hover:bg-bgElevated" title="Delete Subject">
                               <i data-lucide="trash-2" class="w-4 h-4"></i>
                             </button>`
                          : ''
                        }
                      </div>
                    </div>

                    <div class="flex items-baseline justify-between text-xs text-textSecondary mb-2">
                      <span>Today: <strong class="text-textPrimary font-mono">${formatDurationHuman(todaySec)}</strong> / ${sub.dailyTargetMinutes}m</span>
                      <span class="font-mono font-semibold" style="color:${sub.color}">${pct}%</span>
                    </div>
                    <div class="w-full h-2 bg-bgElevated rounded-full overflow-hidden mb-4">
                      <div class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background-color: ${sub.color}"></div>
                    </div>
                  </div>

                  <div class="pt-3 border-t border-borderSubtle flex items-center justify-between text-xs">
                    <span class="text-textMuted">Accumulated Total: <strong class="text-textPrimary font-mono">${(totalSec / 3600).toFixed(1)}h</strong></span>
                    <button onclick="timerRuntime.pomoSubjectId='${sub.id}'; navigateTo('timer');" class="font-semibold text-accent hover:underline">Study Now →</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Subject Comparison Chart -->
          <div class="card p-5">
            <h2 class="text-base font-bold text-textPrimary mb-1">Subject-Wise Accumulated Hours</h2>

              <canvas id="subjects-bar-chart"></canvas>
            </div>

        const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-subtle').trim() || 'rgba(255,255,255,0.08)';
        const chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: appState.subjects.map((s) => s.name),
            datasets: [{
              label: 'Total Hours',
              data: appState.subjects.map((s) => +((stats.bySubject[s.id] || 0) / 3600).toFixed(2)),
              backgroundColor: appState.subjects.map((s) => s.color),
              borderRadius: 8,
              maxBarThickness: 44
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },

    function initAnalyticsCharts(stats) {
      const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#94a3b8';
      const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-subtle').trim() || 'rgba(255,255,255,0.08)';
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6366f1';

      // Build date series for the selected range (7 / 30 / 90 / 365 / all-time)
      let startDateStr = stats.todayStr;
      if (analyticsRangeDays === 9999) {
        const earliest = appState.sessions.length
          ? appState.sessions.reduce((min, s) => (s.date < min ? s.date : min), stats.todayStr)
          : addDays(stats.todayStr, -29);
        startDateStr = earliest || addDays(stats.todayStr, -29);
      } else {
        startDateStr = addDays(stats.todayStr, -(analyticsRangeDays - 1));
      }
      const daysToShow = Math.max(1, Math.round((parseLocalDate(stats.todayStr) - parseLocalDate(startDateStr)) / 86400000) + 1);
      const useFullDateLabels = daysToShow > 120;
      const labels = [];
      const values = [];
      for (let i = daysToShow - 1; i >= 0; i--) {
        const dStr = addDays(stats.todayStr, -i);
        labels.push(useFullDateLabels ? dStr : dStr.slice(5)); // MM-DD or YYYY-MM-DD
        values.push(+((stats.byDate[dStr] || 0) / 3600).toFixed(2));
      }

      const trendCtx = document.getElementById('analytics-trend-chart');
      if (trendCtx) {
        const chart = new Chart(trendCtx, {
          type: daysToShow <= 14 ? 'bar' : 'line',
          data: {
            labels,
            datasets: [{
              label: 'Hours Studied',
              data: values,
              borderColor: accentColor,
              backgroundColor: daysToShow <= 14 ? accentColor : hexToRgba(accentColor.startsWith('#') ? accentColor : '#6366f1', 0.18),
              fill: true,
              tension: 0.35,
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { color: textColor, maxTicksLimit: 12 } },
              y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, callback: (v) => v + 'h' } }
            }
          }
        });
        activeCharts.push(chart);
      }

      const pieCtx = document.getElementById('analytics-pie-chart');
      if (pieCtx) {
        const subLabels = [];
        const subData = [];
        const subColors = [];
        Object.entries(stats.bySubject).forEach(([id, sec]) => {
          if (sec > 0) {
            const s = getSubjectById(id);
            subLabels.push(s.name);
            subData.push(+(sec / 3600).toFixed(2));
            subColors.push(s.color);
          }
        });

        const chart = new Chart(pieCtx, {
          type: 'pie',
          data: {
            labels: subLabels.length ? subLabels : ['No Data'],
            datasets: [{
              data: subData.length ? subData : [1],
              backgroundColor: subColors.length ? subColors : ['#334155'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, font: { size: 11 } } }
            }
          }
        });
        activeCharts.push(chart);
      }
    }

    function exportSessionsCSV() {
      if (appState.sessions.length === 0) {
        showToast('No study sessions available to export.', 'warning');
        return;
      }
      const headers = ['Session ID', 'Date', 'Start Time', 'End Time', 'Duration (Minutes)', 'Subject', 'Mode', 'Status'];
      const rows = appState.sessions.map((s) => [
        s.id,
        s.date,
        formatTimeAMPM(s.startTime),
        formatTimeAMPM(s.endTime),
        (s.durationSeconds / 60).toFixed(1),
        `"${getSubjectById(s.subjectId).name.replace(/"/g, '""')}"`,
        s.mode,
        s.status
      ]);
      const csvContent = [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
      triggerDownload(csvContent, `FocusFlow_Study_Report_${getLocalDateStr()}.csv`, 'text/csv;charset=utf-8;');
      showToast('CSV study report downloaded!', 'success');
    }

    function downloadJSONBackup() {
      const json = JSON.stringify(appState, null, 2);
      triggerDownload(json, `FocusFlow_Backup_${getLocalDateStr()}.json`, 'application/json');
      showToast('JSON backup downloaded.', 'success');
    }

    function restoreJSONBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.sessions)) {
            throw new Error('Invalid backup format');
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
          appState = loadState();
          timerRuntime.pomoSubjectId = appState.subjects[0]?.id || timerRuntime.pomoSubjectId;
          timerRuntime.swSubjectId = appState.subjects[0]?.id || timerRuntime.swSubjectId;
          applyTheme(appState.profile.theme, appState.profile.customAccent);
          showToast('Backup restored successfully!', 'success');
          renderView('dashboard');
        } catch (err) {
          showToast('Invalid JSON backup file.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function loadSampleStudyHistory() {
      if (appState.sessions.some((s) => s.id.startsWith('sample_'))) {
        showToast('Sample study history is already loaded.', 'info');
        return;
      }
      const today = getLocalDateStr();
      const subIds = appState.subjects.map((s) => s.id);
      const sampleSessions = [];

      for (let dayOffset = 0; dayOffset < 21; dayOffset++) {
        // Skip occasional day for realistic pattern, keep last 7 days active for streak
        if (dayOffset > 7 && dayOffset % 4 === 0) continue;
        const dStr = addDays(today, -dayOffset);
        const sessionsCount = (dayOffset % 3) + 1;
        for (let s = 0; s < sessionsCount; s++) {
          const durMin = [25, 45, 50, 60, 90][(dayOffset + s) % 5];
          const startHour = 9 + s * 3;
          const startObj = parseLocalDate(dStr);
          startObj.setHours(startHour, 15, 0, 0);
          const endObj = new Date(startObj.getTime() + durMin * 60000);
          sampleSessions.push({
            id: `sample_${dayOffset}_${s}_${Date.now()}`,
            date: dStr,
            startTime: startObj.toISOString(),
            endTime: endObj.toISOString(),
            durationSeconds: durMin * 60,
            subjectId: subIds[(dayOffset + s) % subIds.length],
            mode: s % 2 === 0 ? 'pomodoro' : 'stopwatch',
            status: 'completed'
          });
        }
      }

      appState.sessions = [...sampleSessions, ...appState.sessions];
      const stats = computeStudyStats();
      checkAchievements(stats);
      saveState();
      showToast('Loaded 3 weeks of realistic sample study history!', 'success');
      renderView('dashboard');
    }

    function confirmClearAllData() {
      openModal(
        'Clear All FocusFlow Data?',
        `<p class="text-rose-400 font-semibold mb-2">Warning: This action cannot be undone.</p>
         <p>All study sessions, streaks, achievements, tasks, and custom settings will be permanently wiped from this browser.</p>`,
        `<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-bgElevated text-textPrimary text-xs font-semibold">Cancel</button>
         <button onclick="executeClearAllData()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-semibold">Yes, Wipe Everything</button>`
      );
    }

    function executeClearAllData() {
      localStorage.removeItem(STORAGE_KEY);
      appState = getDefaultState();
      timerRuntime.pomoSubjectId = appState.subjects[0]?.id || 'sub_cs';
      timerRuntime.swSubjectId = appState.subjects[0]?.id || 'sub_cs';
      applyTheme(appState.profile.theme, null);
      closeModal();
      showToast('All data cleared.', 'info');
      renderView('dashboard');
    }

    function triggerDownload(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ----------------------------------------------------------------------------
    // 13. SIDEBAR DRAWER & COLLAPSE INTERACTIONS + INITIALIZATION
    // ----------------------------------------------------------------------------
    function initNavigationListeners() {
      document.querySelectorAll('.nav-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          navigateTo(btn.getAttribute('data-view'));
        });
      });

      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');

      document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      });

      const closeMobileDrawer = () => {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      };
      document.getElementById('close-mobile-sidebar')?.addEventListener('click', closeMobileDrawer);
      backdrop?.addEventListener('click', closeMobileDrawer);

      document.getElementById('collapse-sidebar-btn')?.addEventListener('click', () => {
        appState.profile.sidebarCollapsed = !appState.profile.sidebarCollapsed;
        applySidebarCollapseState();
        saveState();
      });

      // Close modal on backdrop click
      document.getElementById('custom-modal')?.addEventListener('click', (e) => {
        if (e.target.id === 'custom-modal') closeModal();
      });
    }

    function applySidebarCollapseState() {
      const sidebar = document.getElementById('sidebar');
      const labels = document.querySelectorAll('.sidebar-label');
      if (appState.profile.sidebarCollapsed) {
        sidebar.classList.remove('w-64');
        sidebar.classList.add('w-20');
        labels.forEach((el) => el.classList.add('lg:hidden'));
      } else {
        sidebar.classList.add('w-64');
        sidebar.classList.remove('w-20');
        labels.forEach((el) => el.classList.remove('lg:hidden'));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme(appState.profile.theme, appState.profile.customAccent);
      applySidebarCollapseState();
      initNavigationListeners();
      startMasterTick();
      navigateTo('dashboard');
    });
  </script>
</body>
</html>
