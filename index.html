<!DOCTYPE html>
<html lang="en" data-theme="dark-midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow — Personal Study Tracker & Productivity Platform</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    const twColorMix = (name) => `color-mix(in srgb, var(${name}) calc(100% * <alpha-value>), transparent)`;
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bgBase: twColorMix('--bg-base'),
            bgSurface: twColorMix('--bg-surface'),
            bgElevated: twColorMix('--bg-elevated'),
            borderSubtle: 'var(--border-subtle)',
            textPrimary: twColorMix('--text-primary'),
            textSecondary: twColorMix('--text-secondary'),
            textMuted: twColorMix('--text-muted'),
            accent: twColorMix('--accent'),
            accentHover: twColorMix('--accent-hover'),
            accentSoft: 'var(--accent-soft)',
          }
        }
      }
    };
  </script>

  <style>
    :root, [data-theme="dark-midnight"] {
      --bg-base: #0b0e14;
      --bg-surface: #121722;
      --bg-elevated: #19202e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --bg-gradient: radial-gradient(circle at top right, rgba(99, 102, 241, 0.10), transparent 45%);
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light-minimal"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-elevated: #f1f5f9;
      --border-subtle: rgba(15, 23, 42, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.10);
      --bg-gradient: radial-gradient(circle at top right, rgba(79, 70, 229, 0.06), transparent 45%);
      --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
    }

    [data-theme="forest-green"] {
      --bg-base: #0a1410;
      --bg-surface: #111f19;
      --bg-elevated: #172b22;
      --border-subtle: rgba(52, 211, 153, 0.12);
      --text-primary: #ecfdf5;
      --text-secondary: #a7f3d0;
      --text-muted: #6ee7b7;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.16);
      --bg-gradient: radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 50%);
      --card-shadow: 0 4px 22px -2px rgba(0, 0, 0, 0.4);
    }

    [data-theme="ocean-blue"] {
      --bg-base: #07131d;
      --bg-surface: #0d1f2d;
      --bg-elevated: #132c40;
      --border-subtle: rgba(56, 189, 248, 0.12);
      --text-primary: #f0f9ff;
      --text-secondary: #bae6fd;
      --text-muted: #7dd3fc;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --accent-soft: rgba(14, 165, 233, 0.16);
      --bg-gradient: radial-gradient(circle at top right, rgba(14, 165, 233, 0.14), transparent 50%);
      --card-shadow: 0 4px 22px -2px rgba(0, 0, 0, 0.4);
    }

    [data-theme="sunset-orange"] {
      --bg-base: #160d0b;
      --bg-surface: #221411;
      --bg-elevated: #2f1c18;
      --border-subtle: rgba(251, 146, 60, 0.14);
      --text-primary: #fff7ed;
      --text-secondary: #fed7aa;
      --text-muted: #fdba74;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-soft: rgba(249, 115, 22, 0.16);
      --bg-gradient: radial-gradient(circle at top right, rgba(249, 115, 22, 0.14), transparent 50%);
      --card-shadow: 0 4px 22px -2px rgba(0, 0, 0, 0.45);
    }

    [data-theme="purple-dream"] {
      --bg-base: #110b1c;
      --bg-surface: #1a112b;
      --bg-elevated: #25193d;
      --border-subtle: rgba(192, 132, 252, 0.14);
      --text-primary: #faf5ff;
      --text-secondary: #e9d5ff;
      --text-muted: #c084fc;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --accent-soft: rgba(168, 85, 247, 0.16);
      --bg-gradient: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15), transparent 50%);
      --card-shadow: 0 4px 22px -2px rgba(0, 0, 0, 0.45);
    }

    [data-theme="amoled-black"] {
      --bg-base: #000000;
      --bg-surface: #09090b;
      --bg-elevated: #141417;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --bg-gradient: none;
      --card-shadow: none;
    }

    [data-theme="study-cafe"] {
      --bg-base: #1c1613;
      --bg-surface: #261e1a;
      --bg-elevated: #332823;
      --border-subtle: rgba(214, 184, 152, 0.14);
      --text-primary: #fdf8f4;
      --text-secondary: #e7d8c9;
      --text-muted: #bfa893;
      --accent: #d97706;
      --accent-hover: #b45309;
      --accent-soft: rgba(217, 119, 6, 0.18);
      --bg-gradient: radial-gradient(circle at top right, rgba(217, 119, 6, 0.12), transparent 50%);
      --card-shadow: 0 4px 22px -2px rgba(0, 0, 0, 0.45);
    }

    body {
      background-color: var(--bg-base);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--card-shadow);
      border-radius: 1rem;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.25s ease;
    }

    .card-hover:hover {
      border-color: var(--accent);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Range Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: var(--bg-elevated);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* View fade-in animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-view {
      animation: fadeSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Print Styling for Study Reports */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      #sidebar, #mobile-header, #toast-container, #ambient-mini-bar, .no-print {
        display: none !important;
      }
      #main-content {
        margin-left: 0 !important;
        padding: 0 !important;
      }
      .card {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col lg:flex-row selection:bg-accent selection:text-white">

  <!-- Mobile Top Header -->
  <header id="mobile-header" class="lg:hidden sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-bgSurface/90 backdrop-blur-md border-b border-borderSubtle">
    <div class="flex items-center gap-2.5">
      <button id="mobile-menu-btn" aria-label="Open menu" class="p-2 rounded-xl bg-bgElevated text-textPrimary hover:text-accent transition">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-accent flex items-center justify-center text-white font-bold shadow-sm">
          <i data-lucide="flame" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-lg tracking-tight">FocusFlow</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openFocusOverlay()" class="px-3 py-1.5 rounded-xl bg-accentSoft text-accent text-xs font-semibold flex items-center gap-1.5">
        <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> Focus
      </button>
    </div>
  </header>

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden lg:hidden"></div>

  <!-- Collapsible Sidebar -->
  <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-64 bg-bgSurface border-r border-borderSubtle flex flex-col justify-between transition-all duration-300 -translate-x-full lg:translate-x-0 shrink-0">
    <div class="p-4 flex flex-col h-full overflow-y-auto">
      <!-- Brand Header -->
      <div class="flex items-center justify-between px-2 py-2 mb-5">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center text-white shrink-0 shadow-md">
            <i data-lucide="flame" class="w-5 h-5"></i>
          </div>
          <div class="sidebar-label truncate">
            <h1 class="font-bold text-lg tracking-tight leading-none">FocusFlow</h1>
            <p class="text-[11px] text-textMuted mt-1 font-medium">Deep Work OS</p>
          </div>
        </div>
        <button id="collapse-sidebar-btn" title="Toggle Sidebar" class="hidden lg:flex p-1.5 rounded-lg text-textSecondary hover:text-textPrimary hover:bg-bgElevated transition">
          <i data-lucide="panel-left-close" class="w-4 h-4"></i>
        </button>
        <button id="close-mobile-sidebar" class="lg:hidden p-1.5 rounded-lg text-textSecondary hover:text-textPrimary">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Primary Navigation -->
      <nav class="space-y-1 flex-1" id="sidebar-nav">
        <button data-view="dashboard" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Dashboard</span>
        </button>
        <button data-view="timer" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="timer" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Focus Timer</span>
        </button>
        <button data-view="stopwatch" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="watch" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Stopwatch</span>
        </button>
        <button data-view="planner" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="check-square" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Study Planner</span>
        </button>
        <button data-view="subjects" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="book-open" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Subjects & Goals</span>
        </button>
        <button data-view="analytics" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="bar-chart-3" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Analytics & Reports</span>
        </button>
        <button data-view="calendar" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="calendar" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Study Calendar</span>
        </button>
        <button data-view="achievements" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="trophy" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Achievements</span>
        </button>
        <button data-view="sounds" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="headphones" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Focus Sounds</span>
        </button>
        <button data-view="settings" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          <i data-lucide="settings" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Settings</span>
        </button>
      </nav>

      <!-- Bottom Quick Focus & Level Pill -->
      <div class="pt-4 mt-4 border-t border-borderSubtle space-y-3">
        <button onclick="openFocusOverlay()" class="w-full py-2.5 px-3 rounded-xl bg-accent hover:bg-accentHover text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-sm transition">
          <i data-lucide="maximize-2" class="w-4 h-4 shrink-0"></i>
          <span class="sidebar-label truncate">Focus Mode</span>
        </button>

        <div class="sidebar-label p-3 rounded-xl bg-bgElevated/80 border border-borderSubtle">
          <div class="flex items-center justify-between text-xs mb-1.5">
            <span class="font-semibold text-textPrimary" id="sidebar-level-label">Level 1 Scholar</span>
            <span class="text-accent font-mono font-semibold" id="sidebar-xp-label">0 XP</span>
          </div>
          <div class="w-full h-1.5 bg-bgBase rounded-full overflow-hidden">
            <div id="sidebar-xp-bar" class="h-full bg-accent rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Workspace Area -->
  <main id="main-content" class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 max-w-[1440px] mx-auto w-full pb-24">
    <!-- Persistent Top Status Strip (Active Timer / Ambient Indicator) -->
    <div id="live-status-strip" class="hidden mb-5 px-4 py-2.5 rounded-2xl bg-bgSurface border border-accent/40 flex flex-wrap items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full bg-accent animate-ping"></span>
        <span class="text-xs font-semibold uppercase tracking-wider text-accent" id="strip-mode-label">POMODORO FOCUS</span>
        <span class="font-mono font-bold text-base text-textPrimary" id="strip-time-label">25:00</span>
        <span class="text-xs text-textSecondary hidden sm:inline" id="strip-subject-label">• Computer Science</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="navigateTo('timer')" class="px-3 py-1 rounded-lg bg-bgElevated hover:bg-accentSoft text-xs font-medium text-textPrimary transition">Open Timer</button>
        <button onclick="openFocusOverlay()" class="px-3 py-1 rounded-lg bg-accent text-white text-xs font-semibold transition">Fullscreen</button>
      </div>
    </div>

    <!-- Dynamic View Container -->
    <div id="view-container" class="animate-view"></div>
  </main>

  <!-- Floating Ambient Sound Mini-Player (Shown when audio is playing) -->
  <div id="ambient-mini-bar" class="hidden fixed bottom-4 right-4 z-40 bg-bgSurface/95 backdrop-blur-md border border-borderSubtle rounded-2xl px-4 py-3 shadow-xl flex items-center gap-3 max-w-sm">
    <div class="w-9 h-9 rounded-xl bg-accentSoft text-accent flex items-center justify-center shrink-0">
      <i data-lucide="volume-2" class="w-4 h-4"></i>
    </div>
    <div class="min-w-0 flex-1">
      <p class="text-xs font-semibold text-textPrimary truncate" id="mini-sound-names">Rain & Fireplace</p>
      <p class="text-[11px] text-textMuted">Ambient Soundscape Active</p>
    </div>
    <button onclick="toggleAllAmbientSounds()" id="mini-sound-toggle" class="p-2 rounded-xl bg-accent text-white hover:bg-accentHover transition" title="Pause/Resume Audio">
      <i data-lucide="pause" class="w-4 h-4"></i>
    </button>
    <button onclick="navigateTo('sounds')" class="p-2 rounded-xl bg-bgElevated text-textSecondary hover:text-textPrimary transition" title="Sound Mixer">
      <i data-lucide="sliders" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Fullscreen Distraction-Free Focus Mode Overlay -->
  <div id="focus-overlay" class="fixed inset-0 z-50 hidden bg-bgBase flex-col justify-between p-6 sm:p-10 overflow-y-auto" style="background-image: var(--bg-gradient);">
    <div class="flex items-center justify-between max-w-5xl mx-auto w-full">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center text-white">
          <i data-lucide="flame" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="text-xs font-semibold uppercase tracking-widest text-accent">Deep Focus Mode</span>
          <h2 class="text-sm font-medium text-textSecondary" id="overlay-subject-display">Computer Science</h2>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleBrowserFullscreen()" class="p-2.5 rounded-xl bg-bgSurface border border-borderSubtle text-textSecondary hover:text-textPrimary transition" title="Toggle Browser Fullscreen">
          <i data-lucide="expand" class="w-4 h-4"></i>
        </button>
        <button onclick="closeFocusOverlay()" class="px-4 py-2 rounded-xl bg-bgSurface border border-borderSubtle text-sm font-medium text-textPrimary hover:border-accent transition flex items-center gap-2">
          <i data-lucide="minimize-2" class="w-4 h-4"></i> Exit Focus
        </button>
      </div>
    </div>

    <!-- Center Timer & Progress -->
    <div class="my-auto py-8 flex flex-col items-center text-center max-w-2xl mx-auto w-full">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-bgSurface border border-borderSubtle text-xs font-semibold text-accent mb-6" id="overlay-mode-badge">
        POMODORO FOCUS SESSION
      </div>

      <div class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center mb-8">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 260 260">
          <circle cx="130" cy="130" r="116" stroke="var(--bg-elevated)" stroke-width="10" fill="none" />
          <circle id="overlay-progress-ring" cx="130" cy="130" r="116" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="728.85" stroke-dashoffset="0" class="transition-all duration-300" />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="overlay-timer-display" class="font-mono text-5xl sm:text-6xl font-bold tracking-tight text-textPrimary">25:00</span>
          <span id="overlay-status-sub" class="text-xs text-textMuted mt-2 font-medium">Ready to begin</span>
        </div>
      </div>

      <!-- Overlay Controls -->
      <div class="flex flex-wrap items-center justify-center gap-3 mb-8">
        <button id="overlay-primary-btn" onclick="handleOverlayPrimaryAction()" class="px-8 py-3.5 rounded-2xl bg-accent hover:bg-accentHover text-white font-semibold text-base shadow-lg transition flex items-center gap-2">
          <i data-lucide="play" class="w-5 h-5"></i> Start Session
        </button>
        <button onclick="handleOverlayResetAction()" class="px-5 py-3.5 rounded-2xl bg-bgSurface border border-borderSubtle hover:border-accent text-textPrimary font-medium text-sm transition flex items-center gap-2">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
        </button>
        <button id="overlay-finish-btn" onclick="handleOverlayFinishAction()" class="hidden px-5 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm transition flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i> Finish & Save
        </button>
      </div>

      <!-- Daily Quote inside Focus Mode -->
      <p id="overlay-quote" class="text-sm sm:text-base italic text-textSecondary max-w-lg leading-relaxed"></p>
    </div>

    <!-- Bottom Ambient Sound Quick Controls -->
    <div class="max-w-3xl mx-auto w-full bg-bgSurface/80 backdrop-blur-md border border-borderSubtle rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button onclick="toggleAllAmbientSounds()" class="p-2.5 rounded-xl bg-accentSoft text-accent hover:bg-accent hover:text-white transition">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
        <div>
          <p class="text-xs font-semibold text-textPrimary">Ambient Soundscape</p>
          <p class="text-[11px] text-textMuted" id="overlay-sound-status">Click a quick sound to layer focus audio</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="quickToggleSound('rain')" class="overlay-sound-chip px-3 py-1.5 rounded-xl bg-bgElevated text-xs font-medium text-textSecondary hover:text-textPrimary transition" data-sound="rain">🌧️ Rain</button>

  <!-- Custom Modal Container (Confirmations, Day Details, Subject Edit) -->

    <div class="bg-bgSurface border border-borderSubtle rounded-2xl max-w-lg w-full p-6 shadow-2xl animate-view" id="custom-modal-box">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none"></div>

  <script>
    /**
     * ============================================================================
     * FOCUSFLOW — COMPLETE CLIENT-SIDE ARCHITECTURE
     * Modular state management, timestamp-accurate timers, procedural Web Audio
     * ambient sound synthesizer, analytics engine, and gamification system.
     * ============================================================================
     */

    // ----------------------------------------------------------------------------
    // 1. CONSTANTS, QUOTES & DEFAULT SEED DATA
    // ----------------------------------------------------------------------------
    const STORAGE_KEY = 'focusflow_platform_v1';

    const MOTIVATIONAL_QUOTES = [

      { text: "Concentrate every minute like a Roman on doing what is in front of you with precise and genuine seriousness.", author: "Marcus Aurelius" },

    ];

    const THEMES = [
      { id: 'dark-midnight', name: 'Dark Midnight', swatch: '#0b0e14', accent: '#6366f1' },
      { id: 'light-minimal', name: 'Light Minimal', swatch: '#f8fafc', accent: '#4f46e5' },
      { id: 'forest-green', name: 'Forest Green', swatch: '#0a1410', accent: '#10b981' },
      { id: 'ocean-blue', name: 'Ocean Blue', swatch: '#07131d', accent: '#0ea5e9' },
      { id: 'sunset-orange', name: 'Sunset Orange', swatch: '#160d0b', accent: '#f97316' },
      { id: 'purple-dream', name: 'Purple Dream', swatch: '#110b1c', accent: '#a855f7' },

      { id: 'study-cafe', name: 'Study Cafe', swatch: '#1c1613', accent: '#d97706' }
    ];

    const ACCENT_PRESETS = [

    const DEFAULT_SUBJECTS = [

      { id: 'streak_30', title: '30-Day Streak', desc: 'Study consistently for 30 consecutive days.', icon: 'zap', xp: 2000, check: (stats) => stats.currentStreak >= 30 || stats.bestStreak >= 30 },
      { id: 'club_100h', title: '100 Study Hours', desc: 'Reach 100 lifetime hours of deep focus.', icon: 'medal', xp: 3000, check: (stats) => stats.lifetimeHours >= 100 },
      { id: 'club_500h', title: '500 Study Hours', desc: 'Mastery milestone: 500 lifetime study hours.', icon: 'crown', xp: 10000, check: (stats) => stats.lifetimeHours >= 500 },
      { id: 'club_1000h', title: '1000 Study Hours', desc: 'Legendary scholar: 1,000 lifetime study hours.', icon: 'star', xp: 25000, check: (stats) => stats.lifetimeHours >= 1000 }
    ];

    const AMBIENT_SOUNDS_CATALOG = [
      { id: 'rain', name: 'Rain', emoji: '🌧️', category: 'Nature' },
      { id: 'heavyRain', name: 'Heavy Rain', emoji: '⛈️', category: 'Nature' },
      { id: 'thunderstorm', name: 'Thunderstorm', emoji: '⚡', category: 'Nature' },
      { id: 'fireplace', name: 'Fireplace', emoji: '🔥', category: 'Cozy' },
      { id: 'firecrackers', name: 'Firecrackers', emoji: '🧨', category: 'Ambience' },
      { id: 'forestBirds', name: 'Forest Birds', emoji: '🐦', category: 'Nature' },
      { id: 'oceanWaves', name: 'Ocean Waves', emoji: '🌊', category: 'Nature' },
      { id: 'waterStream', name: 'Water Stream', emoji: '💧', category: 'Nature' },
      { id: 'wind', name: 'Wind', emoji: '🍃', category: 'Nature' },
      { id: 'whiteNoise', name: 'White Noise', emoji: '📻', category: 'Focus Noise' },
      { id: 'brownNoise', name: 'Brown Noise', emoji: '🟤', category: 'Focus Noise' },
      { id: 'pinkNoise', name: 'Pink Noise', emoji: '🌸', category: 'Focus Noise' },
      { id: 'cafe', name: 'Cafe Background', emoji: '☕', category: 'Ambience' },
      { id: 'keyboard', name: 'Keyboard Typing', emoji: '⌨️', category: 'Workspace' },
      { id: 'nightCrickets', name: 'Night Crickets', emoji: '🦗', category: 'Nature' }
    ];

    // ----------------------------------------------------------------------------
    // 2. DATE & TIMEZONE UTILITIES (Local YYYY-MM-DD safe)
    // ----------------------------------------------------------------------------
    function getLocalDateStr(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(dateStr, delta) {
      const d = parseLocalDate(dateStr);
      d.setDate(d.getDate() + delta);
      return getLocalDateStr(d);
    }

    function formatDurationHuman(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m`;
      return `${sec}s`;
    }

    function formatClockMMSS(totalSeconds) {
      const sec = Math.max(0, Math.ceil(totalSeconds));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatStopwatchHMS(ms) {
      const totalMs = Math.max(0, Math.floor(ms));
      const h = Math.floor(totalMs / 3600000);
      const m = Math.floor((totalMs % 3600000) / 60000);
      const s = Math.floor((totalMs % 60000) / 1000);
      const cs = Math.floor((totalMs % 1000) / 10);
      return {
        main: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`,
        ms: `.${String(cs).padStart(2, '0')}`
      };
    }

    function formatTimeAMPM(isoString) {
      if (!isoString) return '--:--';
      const d = new Date(isoString);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ----------------------------------------------------------------------------
    // 3. PERSISTENT STATE STORE (LocalStorage)
    // ----------------------------------------------------------------------------
    function getDefaultState() {
      return {
        profile: {
          username: 'Scholar',
          theme: 'dark-midnight',
          customAccent: null,
          sidebarCollapsed: false
        },
        goals: {
          dailyMinutes: 180,     // 3 hours
          weeklyMinutes: 1200,   // 20 hours
          monthlyMinutes: 4800,  // 80 hours
          longTermHours: 500
        },
        pomodoroSettings: {
          focusMinutes: 25,
          shortBreakMinutes: 5,
          longBreakMinutes: 15,
          autoTransition: false,
          soundAlerts: true,
          browserNotifications: true
        },
        subjects: [...DEFAULT_SUBJECTS],
        sessions: [], // { id, date, startTime, endTime, durationSeconds, subjectId, mode, status }
        tasks: [],    // { id, title, subjectId, deadline, priority, timeSlot, completed, createdAt }
        soundPresets: [
          { id: 'preset_rain_cafe', name: 'Rainy Study Cafe', volumes: { rain: 0.55, cafe: 0.45, fireplace: 0.25 } },
          { id: 'preset_deep_brown', name: 'Deep Focus Cocoon', volumes: { brownNoise: 0.65, wind: 0.2 } },
          { id: 'preset_forest_stream', name: 'Woodland Creek', volumes: { forestBirds: 0.5, waterStream: 0.55 } }
        ],
        unlockedAchievements: [],
        bonusXp: 0,
        claimedChallenges: []
      };
    }

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const def = getDefaultState();
        return {
          ...def,
          ...parsed,
          profile: { ...def.profile, ...(parsed.profile || {}) },
          goals: { ...def.goals, ...(parsed.goals || {}) },
          pomodoroSettings: { ...def.pomodoroSettings, ...(parsed.pomodoroSettings || {}) },
          subjects: Array.isArray(parsed.subjects) && parsed.subjects.length ? parsed.subjects : def.subjects,
          sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          soundPresets: Array.isArray(parsed.soundPresets) ? parsed.soundPresets : def.soundPresets,
          unlockedAchievements: Array.isArray(parsed.unlockedAchievements) ? parsed.unlockedAchievements : [],
          claimedChallenges: Array.isArray(parsed.claimedChallenges) ? parsed.claimedChallenges : []
        };
      } catch (err) {
        console.error('Failed to load FocusFlow state:', err);
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('Failed to save FocusFlow state:', err);
        showToast('Storage warning: Could not persist data to browser storage.', 'error');
      }
    }

    // ----------------------------------------------------------------------------
    // 4. TIMESTAMP-ACCURATE POMODORO & STOPWATCH ENGINE
    // ----------------------------------------------------------------------------
    const timerRuntime = {
      activeTool: 'pomodoro', // 'pomodoro' | 'stopwatch'
      // Pomodoro state
      pomoMode: 'focus', // 'focus' | 'shortBreak' | 'longBreak'
      pomoDurationSec: appState.pomodoroSettings.focusMinutes * 60,
      pomoRemainingSec: appState.pomodoroSettings.focusMinutes * 60,
      pomoRunning: false,
      pomoEndTimestamp: null,
      pomoSessionStartISO: null,
      pomoSubjectId: appState.subjects[0]?.id || 'sub_cs',
      pomoCyclesCompleted: 0,

      // Stopwatch state
      swRunning: false,
      swAccumulatedMs: 0,
      swLastStartTimestamp: null,
      swSessionStartISO: null,
      swSubjectId: appState.subjects[0]?.id || 'sub_cs',
      swSavedLock: false
    };

    let masterTickInterval = null;

    function startMasterTick() {
      if (masterTickInterval) return;
      masterTickInterval = setInterval(() => {
        const now = Date.now();

        // 1. Update Pomodoro via endTimestamp delta
        if (timerRuntime.pomoRunning && timerRuntime.pomoEndTimestamp) {
          const remMs = timerRuntime.pomoEndTimestamp - now;
          if (remMs <= 0) {
            timerRuntime.pomoRemainingSec = 0;
            timerRuntime.pomoRunning = false;
            timerRuntime.pomoEndTimestamp = null;
            handlePomodoroComplete();
          } else {
            timerRuntime.pomoRemainingSec = remMs / 1000;
          }
        }

        // 2. Update UI clocks smoothly
        updateLiveTimerDisplays();
      }, 50);
    }

    // Pomodoro Actions
    function setPomodoroMode(mode, customMinutes = null) {
      if (timerRuntime.pomoRunning) {
        pausePomodoro();
      }
      timerRuntime.pomoMode = mode;
      let mins = appState.pomodoroSettings.focusMinutes;
      if (mode === 'shortBreak') mins = appState.pomodoroSettings.shortBreakMinutes;
      if (mode === 'longBreak') mins = appState.pomodoroSettings.longBreakMinutes;
      if (customMinutes !== null && customMinutes > 0) mins = customMinutes;

      timerRuntime.pomoDurationSec = Math.round(mins * 60);
      timerRuntime.pomoRemainingSec = timerRuntime.pomoDurationSec;
      timerRuntime.pomoSessionStartISO = null;
      updateLiveTimerDisplays();
      if (currentView === 'timer') renderView('timer');
    }

    function startPomodoro() {
      if (timerRuntime.pomoRunning) return;
      timerRuntime.activeTool = 'pomodoro';
      if (!timerRuntime.pomoSessionStartISO) {
        timerRuntime.pomoSessionStartISO = new Date().toISOString();
      }
      timerRuntime.pomoEndTimestamp = Date.now() + timerRuntime.pomoRemainingSec * 1000;
      timerRuntime.pomoRunning = true;
      requestBrowserNotificationPermission();
      updateLiveTimerDisplays();
      if (currentView === 'timer') renderView('timer');
    }

    function pausePomodoro() {
      if (!timerRuntime.pomoRunning) return;
      const remMs = Math.max(0, timerRuntime.pomoEndTimestamp - Date.now());
      timerRuntime.pomoRemainingSec = remMs / 1000;
      timerRuntime.pomoRunning = false;
      timerRuntime.pomoEndTimestamp = null;
      updateLiveTimerDisplays();
      if (currentView === 'timer') renderView('timer');
    }

    function resetPomodoro() {
      timerRuntime.pomoRunning = false;
      timerRuntime.pomoEndTimestamp = null;
      timerRuntime.pomoRemainingSec = timerRuntime.pomoDurationSec;
      timerRuntime.pomoSessionStartISO = null;
      updateLiveTimerDisplays();
      if (currentView === 'timer') renderView('timer');
    }

    function handlePomodoroComplete() {
      playCompletionChime();
      const isFocus = timerRuntime.pomoMode === 'focus';

      if (isFocus) {
        const endISO = new Date().toISOString();
        const startISO = timerRuntime.pomoSessionStartISO || new Date(Date.now() - timerRuntime.pomoDurationSec * 1000).toISOString();
        recordCompletedSession({
          startTime: startISO,
          endTime: endISO,
          durationSeconds: timerRuntime.pomoDurationSec,
          subjectId: timerRuntime.pomoSubjectId,
          mode: 'pomodoro'
        });
        timerRuntime.pomoCyclesCompleted += 1;
        sendBrowserNotification('Focus Session Complete! 🎉', `Logged ${Math.round(timerRuntime.pomoDurationSec / 60)} minutes of focused study.`);

        // Transition to break
        const nextMode = timerRuntime.pomoCyclesCompleted % 4 === 0 ? 'longBreak' : 'shortBreak';
        setPomodoroMode(nextMode);
        if (appState.pomodoroSettings.autoTransition) {
          startPomodoro();
        }
      } else {
        // Break completed — NEVER count break time as study time
        sendBrowserNotification('Break Finished!', 'Ready to jump back into your next focus block?');
        showToast('Break complete! Ready for your next focus session.', 'info');
        setPomodoroMode('focus');
        if (appState.pomodoroSettings.autoTransition) {
          startPomodoro();
        }
      }

      if (currentView === 'timer' || currentView === 'dashboard') {
        renderView(currentView);
      }
    }

    // Stopwatch Actions
    function getStopwatchElapsedMs() {
      if (timerRuntime.swRunning && timerRuntime.swLastStartTimestamp) {
        return timerRuntime.swAccumulatedMs + (Date.now() - timerRuntime.swLastStartTimestamp);
      }
      return timerRuntime.swAccumulatedMs;
    }

    function startStopwatch() {
      if (timerRuntime.swRunning) return;
      timerRuntime.activeTool = 'stopwatch';
      if (!timerRuntime.swSessionStartISO) {
        timerRuntime.swSessionStartISO = new Date().toISOString();
      }
      timerRuntime.swSavedLock = false;
      timerRuntime.swLastStartTimestamp = Date.now();
      timerRuntime.swRunning = true;
      updateLiveTimerDisplays();
      if (currentView === 'stopwatch') renderView('stopwatch');
    }

    function pauseStopwatch() {
      if (!timerRuntime.swRunning) return;
      timerRuntime.swAccumulatedMs += Date.now() - timerRuntime.swLastStartTimestamp;
      timerRuntime.swLastStartTimestamp = null;
      timerRuntime.swRunning = false;
      updateLiveTimerDisplays();
      if (currentView === 'stopwatch') renderView('stopwatch');
    }

    function resetStopwatch() {
      timerRuntime.swRunning = false;
      timerRuntime.swAccumulatedMs = 0;
      timerRuntime.swLastStartTimestamp = null;
      timerRuntime.swSessionStartISO = null;
      timerRuntime.swSavedLock = false;
      updateLiveTimerDisplays();
      if (currentView === 'stopwatch') renderView('stopwatch');
    }

    function finishAndSaveStopwatch() {
      if (timerRuntime.swSavedLock) return;
      if (timerRuntime.swRunning) {
        pauseStopwatch();
      }
      const elapsedSec = Math.floor(timerRuntime.swAccumulatedMs / 1000);
      if (elapsedSec < 30) {
        showToast('Sessions under 30 seconds are not recorded. Keep studying!', 'warning');
        return;
      }

      // Safeguard against accidental/unattended runaway sessions (> 4 hours)
      const MAX_SINGLE_SESSION_SEC = 4 * 3600;
      if (elapsedSec > MAX_SINGLE_SESSION_SEC) {
        openModal(
          'Unusually Long Session Detected',
          `<p class="mb-3">Your stopwatch ran for <strong>${formatDurationHuman(elapsedSec)}</strong>. To protect study integrity against unattended timers, sessions are capped at <strong>4 hours</strong> unless confirmed.</p>
           <p>Would you like to log 4 hours (capped) or discard this session?</p>`,
          `<button onclick="closeModal(); resetStopwatch();" class="px-4 py-2 rounded-xl bg-bgElevated text-textPrimary text-xs font-semibold">Discard</button>
           <button onclick="closeModal(); commitStopwatchSession(${MAX_SINGLE_SESSION_SEC});" class="px-4 py-2 rounded-xl bg-accent text-white text-xs font-semibold">Log 4h 0m</button>`
        );
        return;
      }

      commitStopwatchSession(elapsedSec);
    }

    function commitStopwatchSession(durationSeconds) {
      if (timerRuntime.swSavedLock) return;
      timerRuntime.swSavedLock = true;
      const endISO = new Date().toISOString();
      const startISO = timerRuntime.swSessionStartISO || new Date(Date.now() - durationSeconds * 1000).toISOString();

      recordCompletedSession({
        startTime: startISO,
        endTime: endISO,
        durationSeconds,
        subjectId: timerRuntime.swSubjectId,
        mode: 'stopwatch'
      });

      resetStopwatch();
      if (currentView === 'stopwatch' || currentView === 'dashboard') {
        renderView(currentView);
      }
    }

    // ----------------------------------------------------------------------------
    // 5. AUTOMATIC SESSION RECORDING & ANALYTICS ENGINE
    // ----------------------------------------------------------------------------
    function recordCompletedSession({ startTime, endTime, durationSeconds, subjectId, mode }) {
      if (durationSeconds < 10) return;
      const startDateObj = new Date(startTime);
      const dateStr = getLocalDateStr(startDateObj);

      // Duplicate protection check (same startTime & mode within 2s)
      const isDuplicate = appState.sessions.some(
        (s) => s.mode === mode && Math.abs(new Date(s.startTime).getTime() - startDateObj.getTime()) < 2000
      );
      if (isDuplicate) return;

      const prevStats = computeStudyStats();
      const newSession = {
        id: 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        date: dateStr,
        startTime,
        endTime,
        durationSeconds: Math.round(durationSeconds),
        subjectId: subjectId || appState.subjects[0]?.id || 'sub_cs',
        mode,
        status: 'completed'
      };

      appState.sessions.unshift(newSession);
      const newStats = computeStudyStats();

      // Check Goal Achievement Notifications (daily / weekly / monthly / long-term)
      const dailyTargetSec = appState.goals.dailyMinutes * 60;
      let goalNotified = false;
      if (prevStats.todaySeconds < dailyTargetSec && newStats.todaySeconds >= dailyTargetSec) {
        showToast('🎯 Daily Study Goal Achieved! Amazing discipline!', 'success');
        goalNotified = true;
      }

      const goalChecks = [
        { label: 'Weekly', prev: prevStats.weeklySeconds, next: newStats.weeklySeconds, target: appState.goals.weeklyMinutes * 60 },
        { label: 'Monthly', prev: prevStats.monthlySeconds, next: newStats.monthlySeconds, target: appState.goals.monthlyMinutes * 60 },
        { label: 'Long-Term', prev: prevStats.lifetimeSeconds, next: newStats.lifetimeSeconds, target: appState.goals.longTermHours * 3600 }
      ];
      goalChecks.forEach((g) => {
        if (g.target > 0 && g.prev < g.target && g.next >= g.target) {
          showToast(`🏆 ${g.label} Study Goal Achieved! Keep the momentum going.`, 'success');
          goalNotified = true;
        }
      });

      if (!goalNotified) {
        const subjName = getSubjectById(newSession.subjectId)?.name || 'Study';
        showToast(`✅ Saved ${formatDurationHuman(newSession.durationSeconds)} of ${subjName}!`, 'success');
      }

      // Check & Unlock Achievements
      checkAchievements(newStats);
      saveState();
      updateSidebarXP();
    }

    function getSubjectById(id) {
      return appState.subjects.find((s) => s.id === id) || { id, name: 'General Study', color: '#6366f1', dailyTargetMinutes: 60 };
    }

    function computeStudyStats() {
      const now = new Date();
      const todayStr = getLocalDateStr(now);
      const yesterdayStr = addDays(todayStr, -1);

      // Start of current week (Monday)
      const dayOfWeek = now.getDay(); // 0=Sun, 1=Mon...
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const mondayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday);
      const mondayStr = getLocalDateStr(mondayDate);

      const currentMonthPrefix = todayStr.slice(0, 7); // YYYY-MM
      const currentYearPrefix = todayStr.slice(0, 4);  // YYYY

      let todaySeconds = 0;
      let yesterdaySeconds = 0;
      let weeklySeconds = 0;
      let monthlySeconds = 0;
      let yearlySeconds = 0;
      let lifetimeSeconds = 0;
      let longestSessionSeconds = 0;

      const byDate = {};
      const bySubject = {};

      for (const sess of appState.sessions) {
        const dur = sess.durationSeconds || 0;
        lifetimeSeconds += dur;
        if (dur > longestSessionSeconds) longestSessionSeconds = dur;

        byDate[sess.date] = (byDate[sess.date] || 0) + dur;
        bySubject[sess.subjectId] = (bySubject[sess.subjectId] || 0) + dur;

        if (sess.date === todayStr) todaySeconds += dur;
        if (sess.date === yesterdayStr) yesterdaySeconds += dur;
        if (sess.date >= mondayStr && sess.date <= todayStr) weeklySeconds += dur;
        if (sess.date.startsWith(currentMonthPrefix)) monthlySeconds += dur;
        if (sess.date.startsWith(currentYearPrefix)) yearlySeconds += dur;
      }

      // Current week 7-day breakdown (Mon -> Sun)
      const currentWeekDays = [];
      for (let i = 0; i < 7; i++) {
        const dStr = addDays(mondayStr, i);
        const dObj = parseLocalDate(dStr);
        currentWeekDays.push({
          date: dStr,
          label: dObj.toLocaleDateString([], { weekday: 'short' }),
          seconds: byDate[dStr] || 0
        });
      }

      // Best productivity day
      let bestDayDate = null;
      let bestDaySeconds = 0;
      Object.entries(byDate).forEach(([d, sec]) => {
        if (sec > bestDaySeconds) {
          bestDaySeconds = sec;
          bestDayDate = d;
        }
      });

      // Consecutive study-day streak (at least 1 minute studied counts as an active study day)
      const activeDates = Object.keys(byDate).filter((d) => byDate[d] >= 60).sort();
      let currentStreak = 0;
      let cursor = byDate[todayStr] >= 60 ? todayStr : (byDate[yesterdayStr] >= 60 ? yesterdayStr : null);
      if (cursor) {
        while (byDate[cursor] && byDate[cursor] >= 60) {
          currentStreak++;
          cursor = addDays(cursor, -1);
        }
      }

      // Best historical streak
      let bestStreak = 0;
      let tempStreak = 0;
      let prevD = null;
      for (const d of activeDates) {
        if (prevD && addDays(prevD, 1) === d) {
          tempStreak++;
        } else {
          tempStreak = 1;
        }
        if (tempStreak > bestStreak) bestStreak = tempStreak;
        prevD = d;
      }

      // Averages
      const totalActiveDays = Math.max(1, activeDates.length);
      const avgDailySeconds = lifetimeSeconds > 0 ? Math.round(lifetimeSeconds / totalActiveDays) : 0;
      const weeksSpan = Math.max(1, Math.ceil(totalActiveDays / 7));
      const avgWeeklySeconds = lifetimeSeconds > 0 ? Math.round(lifetimeSeconds / weeksSpan) : 0;

      // XP & Level Calculation (10 XP per minute + achievement XP + bonus XP)
      const sessionXp = Math.floor(lifetimeSeconds / 6); // 10 XP per min
      const achievementXp = appState.unlockedAchievements.reduce((acc, id) => {
        const ach = ACHIEVEMENTS_LIST.find((a) => a.id === id);
        return acc + (ach ? ach.xp : 0);
      }, 0);
      const totalXp = sessionXp + achievementXp + (appState.bonusXp || 0);
      const level = Math.floor(Math.sqrt(totalXp / 250)) + 1;
      const currentLevelBaseXp = Math.pow(level - 1, 2) * 250;
      const nextLevelXp = Math.pow(level, 2) * 250;
      const levelProgressPct = Math.min(100, Math.round(((totalXp - currentLevelBaseXp) / (nextLevelXp - currentLevelBaseXp)) * 100));

      return {
        todayStr,
        todaySeconds,
        yesterdaySeconds,
        weeklySeconds,
        monthlySeconds,
        yearlySeconds,
        lifetimeSeconds,
        lifetimeHours: lifetimeSeconds / 3600,
        totalSessions: appState.sessions.length,
        longestSessionSeconds,
        bestDayDate,
        bestDaySeconds,
        currentStreak,
        bestStreak,
        avgDailySeconds,
        avgWeeklySeconds,
        byDate,
        bySubject,
        currentWeekDays,
        totalXp,
        level,
        levelProgressPct,
        nextLevelXp
      };
    }

    function checkAchievements(stats) {
      let newlyUnlocked = false;
      for (const ach of ACHIEVEMENTS_LIST) {
        if (!appState.unlockedAchievements.includes(ach.id) && ach.check(stats)) {
          appState.unlockedAchievements.push(ach.id);
          newlyUnlocked = true;
          showToast(`🏆 Achievement Unlocked: ${ach.title} (+${ach.xp} XP)!`, 'success');
        }
      }
      if (newlyUnlocked) saveState();
    }

    // ----------------------------------------------------------------------------
    // 6. PROCEDURAL WEB AUDIO API AMBIENT SOUND ENGINE (15 SOUNDSCAPES)
    // ----------------------------------------------------------------------------
    class AmbientSoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.masterVolume = 0.8;
        this.isPaused = false;
        this.activeNodes = {}; // soundId -> { gainNode, cleanupFn, volume }
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = this.masterVolume;
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      createNoiseBuffer(type = 'white', durationSec = 4) {
        const sampleRate = this.ctx.sampleRate;
        const length = sampleRate * durationSec;
        const buffer = this.ctx.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);

        if (type === 'white') {
          for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
        } else if (type === 'pink') {
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < length; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
            b6 = white * 0.115926;
          }
        } else if (type === 'brown') {
          let lastOut = 0;
          for (let i = 0; i < length; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.02 * white) / 1.02;
            lastOut = data[i];
            data[i] *= 3.2;
          }
        }
        return buffer;
      }

      startSound(id, volume = 0.5) {
        this.initContext();
        if (this.activeNodes[id]) {
          this.setVolume(id, volume);
          return;
        }

        const gainNode = this.ctx.createGain();
        gainNode.gain.setValueAtTime(0.001, this.ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(Math.max(0.001, volume), this.ctx.currentTime + 0.35);
        gainNode.connect(this.masterGain);

        const timers = [];
        const nodes = [];

        const makeLoopedNoise = (noiseType, filterType, freq, q = 1, gainScale = 1) => {
          const src = this.ctx.createBufferSource();
          src.buffer = this.createNoiseBuffer(noiseType, 4);
          src.loop = true;

          const filter = this.ctx.createBiquadFilter();
          filter.type = filterType;
          filter.frequency.value = freq;
          filter.Q.value = q;

          const subGain = this.ctx.createGain();
          subGain.gain.value = gainScale;

          src.connect(filter);
          filter.connect(subGain);
          subGain.connect(gainNode);
          src.start();
          nodes.push(src);
          return { src, filter, subGain };
        };

        switch (id) {
          case 'whiteNoise':
            makeLoopedNoise('white', 'lowpass', 12000, 0.7, 0.28);
            break;
          case 'pinkNoise':
            makeLoopedNoise('pink', 'lowpass', 8000, 0.7, 0.55);
            break;
          case 'brownNoise':
            makeLoopedNoise('brown', 'lowpass', 900, 0.7, 0.65);
            break;
          case 'rain':
            makeLoopedNoise('pink', 'bandpass', 1100, 0.6, 0.75);
            makeLoopedNoise('white', 'highpass', 3500, 0.5, 0.14);
            break;
          case 'heavyRain':
            makeLoopedNoise('pink', 'lowpass', 1800, 0.7, 0.9);
            makeLoopedNoise('brown', 'lowpass', 400, 0.8, 0.5);
            break;
          case 'thunderstorm': {
            makeLoopedNoise('pink', 'lowpass', 1500, 0.7, 0.8);
            const triggerThunder = () => {
              if (!this.activeNodes[id]) return;
              const now = this.ctx.currentTime;
              const rumble = this.ctx.createBufferSource();
              rumble.buffer = this.createNoiseBuffer('brown', 4);
              const lpf = this.ctx.createBiquadFilter();
              lpf.type = 'lowpass';
              lpf.frequency.setValueAtTime(140, now);
              lpf.frequency.exponentialRampToValueAtTime(45, now + 3.2);

              const env = this.ctx.createGain();
              env.gain.setValueAtTime(0.001, now);
              env.gain.linearRampToValueAtTime(0.95, now + 0.25);
              env.gain.exponentialRampToValueAtTime(0.001, now + 3.5);

              rumble.connect(lpf);
              lpf.connect(env);
              env.connect(gainNode);
              rumble.start(now);
              rumble.stop(now + 3.6);
            };
            triggerThunder();
            timers.push(setInterval(triggerThunder, 9500));
            break;
          }
          case 'fireplace': {
            makeLoopedNoise('brown', 'lowpass', 220, 0.9, 0.6);
            const crackleLoop = setInterval(() => {
              if (!this.activeNodes[id] || Math.random() > 0.65) return;
              const now = this.ctx.currentTime;
              const osc = this.ctx.createBufferSource();
              osc.buffer = this.createNoiseBuffer('white', 0.08);
              const bpf = this.ctx.createBiquadFilter();
              bpf.type = 'bandpass';
              bpf.frequency.value = 1800 + Math.random() * 2500;
              const env = this.ctx.createGain();
              env.gain.setValueAtTime(0.35 * Math.random(), now);
              env.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
              osc.connect(bpf);
              bpf.connect(env);
              env.connect(gainNode);
              osc.start(now);
            }, 140);
            timers.push(crackleLoop);
            break;
          }
          case 'firecrackers': {
            const popLoop = setInterval(() => {
              if (!this.activeNodes[id] || Math.random() > 0.55) return;
              const now = this.ctx.currentTime;
              const burst = this.ctx.createBufferSource();
              burst.buffer = this.createNoiseBuffer('white', 0.12);
              const hpf = this.ctx.createBiquadFilter();
              hpf.type = 'highpass';
              hpf.frequency.value = 900;
              const env = this.ctx.createGain();
              env.gain.setValueAtTime(0.55, now);
              env.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
              burst.connect(hpf);
              hpf.connect(env);
              env.connect(gainNode);
              burst.start(now);
            }, 260);
            timers.push(popLoop);
            break;
          }
          case 'oceanWaves': {
            const { filter, subGain } = makeLoopedNoise('pink', 'lowpass', 600, 0.8, 0.65);
            const lfo = this.ctx.createOscillator();
            lfo.frequency.value = 0.12; // ~8 second wave cycle
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 380;
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();
            nodes.push(lfo);
            break;
          }
          case 'waterStream':
            makeLoopedNoise('pink', 'bandpass', 950, 1.4, 0.7);
            makeLoopedNoise('white', 'bandpass', 2400, 2.0, 0.2);
            break;
          case 'wind': {
            const { filter } = makeLoopedNoise('pink', 'bandpass', 420, 2.8, 0.65);
            const lfo = this.ctx.createOscillator();
            lfo.frequency.value = 0.18;
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.value = 220;
            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            lfo.start();
            nodes.push(lfo);
            break;
          }
          case 'forestBirds': {
            makeLoopedNoise('pink', 'bandpass', 500, 0.5, 0.12);
            const chirpLoop = setInterval(() => {
              if (!this.activeNodes[id] || Math.random() > 0.55) return;
              const now = this.ctx.currentTime;
              const osc = this.ctx.createOscillator();
              osc.type = 'sine';
              const baseFreq = 2200 + Math.random() * 1400;
              osc.frequency.setValueAtTime(baseFreq, now);
              osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, now + 0.09);
              osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.9, now + 0.18);

              const env = this.ctx.createGain();
              env.gain.setValueAtTime(0.001, now);
              env.gain.linearRampToValueAtTime(0.14, now + 0.03);
              env.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

              osc.connect(env);
              env.connect(gainNode);
              osc.start(now);
              osc.stop(now + 0.21);
            }, 1300);
            timers.push(chirpLoop);
            break;
          }
          case 'cafe': {
            makeLoopedNoise('brown', 'bandpass', 380, 0.9, 0.65);
            makeLoopedNoise('pink', 'bandpass', 850, 1.2, 0.35);
            const clinkLoop = setInterval(() => {
              if (!this.activeNodes[id] || Math.random() > 0.35) return;
              const now = this.ctx.currentTime;
              const osc = this.ctx.createOscillator();
              osc.type = 'triangle';
              osc.frequency.value = 3200 + Math.random() * 1200;
              const env = this.ctx.createGain();
              env.gain.setValueAtTime(0.08, now);
              env.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
              osc.connect(env);
              env.connect(gainNode);
              osc.start(now);
              osc.stop(now + 0.15);
            }, 2400);
            timers.push(clinkLoop);
            break;
          }
          case 'keyboard': {
            const typeLoop = setInterval(() => {
              if (!this.activeNodes[id] || Math.random() > 0.72) return;
              const now = this.ctx.currentTime;
              const click = this.ctx.createBufferSource();
              click.buffer = this.createNoiseBuffer('white', 0.04);
              const bpf = this.ctx.createBiquadFilter();
              bpf.type = 'bandpass';
              bpf.frequency.value = 1400 + Math.random() * 900;
              bpf.Q.value = 2.2;
              const env = this.ctx.createGain();
              env.gain.setValueAtTime(0.32, now);
              env.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
              click.connect(bpf);
              bpf.connect(env);
              env.connect(gainNode);
              click.start(now);
            }, 145);
            timers.push(typeLoop);
            break;
          }
          case 'nightCrickets': {
            const cricketLoop = setInterval(() => {
              if (!this.activeNodes[id]) return;
              const now = this.ctx.currentTime;
              for (let p = 0; p < 3; p++) {
                const t = now + p * 0.08;
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 4250;
                const env = this.ctx.createGain();
                env.gain.setValueAtTime(0.001, t);
                env.gain.linearRampToValueAtTime(0.09, t + 0.02);
                env.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
                osc.connect(env);
                env.connect(gainNode);
                osc.start(t);
                osc.stop(t + 0.07);
              }
            }, 1600);
            timers.push(cricketLoop);
            break;
          }
        }

        this.activeNodes[id] = {
          gainNode,
          volume,
          cleanup: () => {
            timers.forEach((t) => clearInterval(t));
            nodes.forEach((n) => {
              try { n.stop(); n.disconnect(); } catch (e) {}
            });
            try { gainNode.disconnect(); } catch (e) {}
          }
        };

        if (this.isPaused && this.ctx.state === 'running') {
          this.isPaused = false;
        }
        updateAmbientUIState();
      }

      stopSound(id) {
        const entry = this.activeNodes[id];
        if (!entry) return;
        entry.cleanup();
        delete this.activeNodes[id];
        updateAmbientUIState();
      }

      setVolume(id, volume) {
        const entry = this.activeNodes[id];
        if (!entry) return;
        entry.volume = volume;
        if (this.ctx) {
          entry.gainNode.gain.setTargetAtTime(Math.max(0.0001, volume), this.ctx.currentTime, 0.05);
        }
      }

      setMasterVolume(vol) {
        this.masterVolume = vol;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(Math.max(0.0001, vol), this.ctx.currentTime, 0.05);
        }
      }

      togglePauseAll() {
        if (!this.ctx) return;
        if (this.ctx.state === 'running') {
          this.ctx.suspend();
          this.isPaused = true;
        } else {
          this.ctx.resume();
          this.isPaused = false;
        }
        updateAmbientUIState();
      }

      stopAll() {
        Object.keys(this.activeNodes).forEach((id) => this.stopSound(id));
      }

      applyPreset(volumesMap) {
        this.stopAll();
        Object.entries(volumesMap).forEach(([soundId, vol]) => {
          if (vol > 0) this.startSound(soundId, vol);
        });
        if (currentView === 'sounds') renderView('sounds');
      }
    }

    const soundEngine = new AmbientSoundEngine();

    function quickToggleSound(soundId) {
      if (soundEngine.activeNodes[soundId]) {
        soundEngine.stopSound(soundId);
      } else {
        soundEngine.startSound(soundId, 0.55);
      }
      if (currentView === 'sounds') renderView('sounds');
    }

    function toggleAllAmbientSounds() {
      soundEngine.togglePauseAll();
    }

    function updateAmbientUIState() {
      const activeIds = Object.keys(soundEngine.activeNodes);
      const miniBar = document.getElementById('ambient-mini-bar');
      const miniNames = document.getElementById('mini-sound-names');
      const miniToggle = document.getElementById('mini-sound-toggle');
      const overlayStatus = document.getElementById('overlay-sound-status');

      if (activeIds.length === 0) {
        miniBar.classList.add('hidden');
        if (overlayStatus) overlayStatus.textContent = 'Click a quick sound to layer focus audio';
      } else {
        miniBar.classList.remove('hidden');
        const names = activeIds
          .map((id) => AMBIENT_SOUNDS_CATALOG.find((s) => s.id === id)?.name || id)
          .join(' • ');
        miniNames.textContent = names;
        if (overlayStatus) overlayStatus.textContent = `Playing: ${names}`;
        miniToggle.innerHTML = soundEngine.isPaused
          ? `<i data-lucide="play" class="w-4 h-4"></i>`
          : `<i data-lucide="pause" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }

      // Highlight overlay sound chips
      document.querySelectorAll('.overlay-sound-chip').forEach((chip) => {
        const sId = chip.getAttribute('data-sound');
        if (soundEngine.activeNodes[sId]) {
          chip.classList.add('bg-accent', 'text-white');
          chip.classList.remove('bg-bgElevated', 'text-textSecondary');
        } else {
          chip.classList.remove('bg-accent', 'text-white');
          chip.classList.add('bg-bgElevated', 'text-textSecondary');
        }
      });
    }

    // Pleasant Web Audio API Chime when Pomodoro Completes
    function playCompletionChime() {
      if (!appState.pomodoroSettings.soundAlerts) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = ctx.currentTime + idx * 0.14;
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.22, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.7);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.75);
        });
      } catch (e) {}
    }

    // Browser Notifications
    function requestBrowserNotificationPermission() {
      if (!appState.pomodoroSettings.browserNotifications) return;
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function sendBrowserNotification(title, body) {
      if (!appState.pomodoroSettings.browserNotifications) return;
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body });
      }
    }

    // ----------------------------------------------------------------------------
    // 7. THEME & APPEARANCE CONTROLLER
    // ----------------------------------------------------------------------------
    function applyTheme(themeId, customAccent = null) {
      document.documentElement.setAttribute('data-theme', themeId);
      appState.profile.theme = themeId;

      if (customAccent !== undefined) {
        appState.profile.customAccent = customAccent;
      }

      if (appState.profile.customAccent) {
        document.documentElement.style.setProperty('--accent', appState.profile.customAccent);
        document.documentElement.style.setProperty('--accent-hover', appState.profile.customAccent);
        document.documentElement.style.setProperty('--accent-soft', hexToRgba(appState.profile.customAccent, 0.15));
      } else {
        document.documentElement.style.removeProperty('--accent');
        document.documentElement.style.removeProperty('--accent-hover');
        document.documentElement.style.removeProperty('--accent-soft');
      }
      saveState();
    }

    function hexToRgba(hex, alpha) {
      const clean = hex.replace('#', '');
      const bigint = parseInt(clean, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // ----------------------------------------------------------------------------
    // 8. LIVE DISPLAY UPDATER (Runs every 50ms without full DOM re-render)
    // ----------------------------------------------------------------------------
    function updateLiveTimerDisplays() {
      const strip = document.getElementById('live-status-strip');
      const stripMode = document.getElementById('strip-mode-label');
      const stripTime = document.getElementById('strip-time-label');
      const stripSubj = document.getElementById('strip-subject-label');

      const anyRunning = timerRuntime.pomoRunning || timerRuntime.swRunning;
      if (anyRunning) {
        strip.classList.remove('hidden');
        if (timerRuntime.pomoRunning) {
          stripMode.textContent = timerRuntime.pomoMode === 'focus' ? 'POMODORO FOCUS' : 'BREAK TIME';
          stripTime.textContent = formatClockMMSS(timerRuntime.pomoRemainingSec);
          stripSubj.textContent = `• ${getSubjectById(timerRuntime.pomoSubjectId).name}`;
        } else {
          stripMode.textContent = 'STOPWATCH';
          stripTime.textContent = formatStopwatchHMS(getStopwatchElapsedMs()).main;
          stripSubj.textContent = `• ${getSubjectById(timerRuntime.swSubjectId).name}`;
        }
      } else {
        strip.classList.add('hidden');
      }

      // Pomodoro DOM nodes if visible
      const pomoDisplay = document.getElementById('pomo-clock-text');
      const pomoRing = document.getElementById('pomo-progress-ring');
      if (pomoDisplay) {
        pomoDisplay.textContent = formatClockMMSS(timerRuntime.pomoRemainingSec);
      }
      if (pomoRing) {
        const circumference = 728.85;
        const pct = timerRuntime.pomoDurationSec > 0
          ? timerRuntime.pomoRemainingSec / timerRuntime.pomoDurationSec
          : 1;
        pomoRing.style.strokeDashoffset = circumference * (1 - pct);
      }

      // Stopwatch DOM nodes if visible
      const swMain = document.getElementById('sw-clock-main');
      const swMs = document.getElementById('sw-clock-ms');
      if (swMain && swMs) {
        const formatted = formatStopwatchHMS(getStopwatchElapsedMs());
        swMain.textContent = formatted.main;
        swMs.textContent = formatted.ms;
      }

      // Fullscreen Focus Overlay synchronization
      const overlay = document.getElementById('focus-overlay');
      if (overlay && !overlay.classList.contains('hidden')) {
        syncFocusOverlayUI();
      }
    }

    // 9. FULLSCREEN FOCUS MODE OVERLAY CONTROLLERS

    function closeFocusOverlay() {

      overlay.classList.add('hidden');
      overlay.classList.remove('flex');

        document.exitFullscreen().catch(() => {});

    function toggleBrowserFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function syncFocusOverlayUI() {
      const isStopwatch = timerRuntime.activeTool === 'stopwatch' || currentView === 'stopwatch';
      const badge = document.getElementById('overlay-mode-badge');
      const subjDisplay = document.getElementById('overlay-subject-display');
      const timerDisplay = document.getElementById('overlay-timer-display');
      const subDisplay = document.getElementById('overlay-status-sub');
      const primaryBtn = document.getElementById('overlay-primary-btn');
      const finishBtn = document.getElementById('overlay-finish-btn');
      const ring = document.getElementById('overlay-progress-ring');
      let primaryHTML = '';
      let finishVisible = false;

      if (isStopwatch) {
        badge.textContent = 'STOPWATCH DEEP WORK';
        subjDisplay.textContent = getSubjectById(timerRuntime.swSubjectId).name;
        const elapsed = getStopwatchElapsedMs();
        const fmt = formatStopwatchHMS(elapsed);
        timerDisplay.textContent = fmt.main;
        subDisplay.textContent = timerRuntime.swRunning ? 'Recording focused study time...' : (elapsed > 0 ? 'Paused' : 'Ready to track');
        primaryHTML = timerRuntime.swRunning
          ? `<i data-lucide="pause" class="w-5 h-5"></i> Pause`
          : `<i data-lucide="play" class="w-5 h-5"></i> ${elapsed > 0 ? 'Resume' : 'Start'}`;
        finishVisible = elapsed >= 30000;

        // Animate ring smoothly every 60s
        const secMod = (elapsed / 1000) % 60;
        ring.style.strokeDashoffset = 728.85 * (1 - secMod / 60);
      } else {
        const modeTitles = { focus: 'POMODORO FOCUS SESSION', shortBreak: 'SHORT BREAK', longBreak: 'LONG BREAK' };
        badge.textContent = modeTitles[timerRuntime.pomoMode] || 'POMODORO';
        subjDisplay.textContent = getSubjectById(timerRuntime.pomoSubjectId).name;
        timerDisplay.textContent = formatClockMMSS(timerRuntime.pomoRemainingSec);
        subDisplay.textContent = timerRuntime.pomoRunning ? 'Stay locked in — distraction free' : 'Paused / Ready';
        const idleLabel = timerRuntime.pomoMode === 'focus' ? 'Start Focus' : (timerRuntime.pomoMode === 'shortBreak' ? 'Start Break' : 'Start Long Break');
        primaryHTML = timerRuntime.pomoRunning
          ? `<i data-lucide="pause" class="w-5 h-5"></i> Pause`
          : `<i data-lucide="play" class="w-5 h-5"></i> ${timerRuntime.pomoRemainingSec < timerRuntime.pomoDurationSec ? 'Resume' : idleLabel}`;

        const pct = timerRuntime.pomoDurationSec > 0 ? timerRuntime.pomoRemainingSec / timerRuntime.pomoDurationSec : 1;
        ring.style.strokeDashoffset = 728.85 * (1 - pct);
      }

      if (primaryBtn.dataset.html !== primaryHTML) {
        primaryBtn.dataset.html = primaryHTML;
        primaryBtn.innerHTML = primaryHTML;
        lucide.createIcons();
      }
      if (finishVisible) finishBtn.classList.remove('hidden');
      else finishBtn.classList.add('hidden');
    }

    function handleOverlayPrimaryAction() {
      const isStopwatch = timerRuntime.activeTool === 'stopwatch' || currentView === 'stopwatch';
      if (isStopwatch) {
        timerRuntime.swRunning ? pauseStopwatch() : startStopwatch();
      } else {
        timerRuntime.pomoRunning ? pausePomodoro() : startPomodoro();
      }
      syncFocusOverlayUI();
    }

    function handleOverlayResetAction() {
      const isStopwatch = timerRuntime.activeTool === 'stopwatch' || currentView === 'stopwatch';
      isStopwatch ? resetStopwatch() : resetPomodoro();
      syncFocusOverlayUI();
    }

    function handleOverlayFinishAction() {
      finishAndSaveStopwatch();
      syncFocusOverlayUI();
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'border-emerald-500/50 bg-bgSurface text-textPrimary',
        error: 'border-rose-500/50 bg-bgSurface text-textPrimary',
        warning: 'border-amber-500/50 bg-bgSurface text-textPrimary',
        info: 'border-accent/50 bg-bgSurface text-textPrimary'
      };
      const icons = {
        success: 'check-circle-2',
        error: 'alert-circle',
        warning: 'alert-triangle',
        info: 'info'
      };
      const iconColors = {
        success: 'text-emerald-400',
        error: 'text-rose-400',
        warning: 'text-amber-400',
        info: 'text-accent'
      };

      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl border shadow-xl backdrop-blur-md animate-view ${colors[type] || colors.info}`;
      el.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0 mt-0.5 ${iconColors[type] || iconColors.info}"></i>
        <p class="text-xs sm:text-sm font-medium leading-snug flex-1">${message}</p>
      `;
      container.appendChild(el);
      lucide.createIcons();

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(12px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3800);
    }

    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return 'Good morning';
      if (hour < 18) return 'Good afternoon';
      return 'Good evening';

      const dayIndex = Math.floor(Date.now() / 86400000) % MOTIVATIONAL_QUOTES.length;

    let currentView = 'dashboard';

    let analyticsRangeDays = 7;
    let calendarMonthDate = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    let plannerFilter = 'today';

    function destroyActiveCharts() {
      activeCharts.forEach((c) => {
        try { c.destroy(); } catch (e) {}
      });
      activeCharts = [];

    function navigateTo(view) {
      currentView = view;
      // Close mobile drawer if open
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-backdrop').classList.add('hidden');

      // Highlight active sidebar button
      document.querySelectorAll('.nav-item').forEach((btn) => {
        if (btn.getAttribute('data-view') === view) {
          btn.classList.add('bg-accentSoft', 'text-accent', 'font-semibold');
          btn.classList.remove('text-textSecondary', 'hover:bg-bgElevated', 'hover:text-textPrimary');
        } else {
          btn.classList.remove('bg-accentSoft', 'text-accent', 'font-semibold');
          btn.classList.add('text-textSecondary', 'hover:bg-bgElevated', 'hover:text-textPrimary');
        }
      });

      renderView(view);
    }

    function renderView(view) {
      destroyActiveCharts();
      const container = document.getElementById('view-container');
      container.classList.remove('animate-view');
      void container.offsetWidth;
      container.classList.add('animate-view');

      switch (view) {
        case 'dashboard': renderDashboardView(container); break;
        case 'timer': renderTimerView(container); break;
        case 'stopwatch': renderStopwatchView(container); break;
        case 'planner': renderPlannerView(container); break;
        case 'subjects': renderSubjectsView(container); break;
        case 'analytics': renderAnalyticsView(container); break;
        case 'calendar': renderCalendarView(container); break;
        case 'achievements': renderAchievementsView(container); break;
        case 'sounds': renderSoundsView(container); break;
        case 'settings': renderSettingsView(container); break;
        default: renderDashboardView(container);
      }

      lucide.createIcons();
      updateLiveTimerDisplays();
      updateSidebarXP();
    }

    function initDashboardCharts(stats) {

      const weeklyCtx = document.getElementById('dash-weekly-chart');
      if (weeklyCtx) {
        const chart = new Chart(weeklyCtx, {
          type: 'bar',
          data: {
            labels: stats.currentWeekDays.map((d) => d.label),
            datasets: [{
              label: 'Hours Studied',
              data: stats.currentWeekDays.map((d) => +(d.seconds / 3600).toFixed(2)),
              backgroundColor: accentColor,
              borderRadius: 8,
              maxBarThickness: 38
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => `${ctx.parsed.y} hrs`
                }
              }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: textColor } },
              y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, callback: (v) => v + 'h' } }
            }
          }
        });
        activeCharts.push(chart);
      }

      const subjCtx = document.getElementById('dash-subject-chart');
      if (subjCtx && stats.totalSessions > 0) {
        const labels = [];
        const data = [];
        const colors = [];
        Object.entries(stats.bySubject).forEach(([subId, sec]) => {
          if (sec > 0) {
            const s = getSubjectById(subId);
            labels.push(s.name);
            data.push(+(sec / 3600).toFixed(2));
            colors.push(s.color);
          }
        });

        const chart = new Chart(subjCtx, {
          type: 'doughnut',
          data: {
            labels,
            datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '68%',
            plugins: {
              legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, padding: 12, font: { size: 11 } } }
            }
          }
        });
        activeCharts.push(chart);
      }
    }
